spring.application.name=payment-service
spring.datasource.url=jdbc:sqlserver://host.docker.internal:1433;databaseName=PaymentDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${SQLSERVER_USERNAME}
spring.datasource.password=${SQLSERVER_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/public.pem

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=redis
spring.data.redis.port=6379