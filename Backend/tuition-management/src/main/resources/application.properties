spring.application.name=tuition
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TuitionDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:keys/public.pem

server.port=3002