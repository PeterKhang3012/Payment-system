spring.application.name=tuition
spring.datasource.url=jdbc:sqlserver://sqlserver:1433;databaseName=TuitionDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${SQLSERVER_USERNAME}
spring.datasource.password=${SQLSERVER_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.resourceserver.jwt.public-key-location=file:${JWT_PUBLIC_KEY_PATH}

server.port=3002
# API validation: reject scalar coercion and fractional IDs instead of silently converting input.
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
# Security: suppress internal details in servlet fallback error responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
